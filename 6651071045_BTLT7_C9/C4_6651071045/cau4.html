<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa mục trong dropdown</title>

    <!-- Font chữ hỗ trợ tiếng Việt -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- File CSS nằm trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
    <main class="card">
        <h1>Xóa mục khỏi dropdown</h1>
        <p class="sub">Chọn một màu rồi nhấn nút để xóa màu đó.</p>

        <form class="row">
            <select id="colorSelect">
                <option>Red</option>
                <option>Green</option>
                <option>White</option>
                <option>Black</option>
            </select>
            <input type="button" class="btn" id="btnRemove" value="Select and Remove">
        </form>

        <div class="out" id="ketqua">Còn lại 4 màu.</div>
    </main>

    <!-- Nạp jQuery trước, sau đó mới nạp file js của bài -->
    <script src="Scripts/jquery.min.js"></script>
    <script src="Scripts/cau4.js"></script>
</body>
</html>
